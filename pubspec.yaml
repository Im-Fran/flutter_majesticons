name: flutter_majesticons
description: >-
  Majesticons for Flutter: 380 line and solid SVG icons, grouped by category and
  generated from the official repository. Const, themable and tree-shakeable.
version: 1.0.1
repository: https://github.com/Im-Fran/flutter_majesticons
issue_tracker: https://github.com/Im-Fran/flutter_majesticons/issues
topics:
  - icons
  - svg
  - majesticons

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
