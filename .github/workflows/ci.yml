name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_call: # reused by publish.yml so a release can't skip these checks

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test and dry-run publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          cache: true
          cache-sdk: true
      - run: flutter pub get
      # The example is analyzed together with the package, so it needs its own dependencies.
      - run: flutter pub get
        working-directory: example
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run
