version: 2
updates:
  # GitHub Actions used by ci.yml and publish.yml. Keeps the pinned commit SHAs
  # up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]

  # Dart and Flutter packages (pubspec.yaml at the repository root).
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
